name: Attest governance evidence

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  attest:
    name: attest review evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: validate untrusted PR evidence without checkout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          set -euo pipefail
          # This heredoc is the single source for the server validator. It reads
          # PR bytes via the API and never checks out, fetches, imports, or runs
          # PR-authored code. CI extracts this exact program for self-tests.
          python3 - <<'PY'
          # GOVERNANCE_EVIDENCE_VALIDATOR_BEGIN
          import argparse
          import base64
          import binascii
          import json
          import os
          import re
          import sys
          from pathlib import PurePosixPath
          from urllib.error import HTTPError, URLError
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          API_ROOT = "https://api.github.com"
          SCHEMA_VERSION = 1
          VALID_ACCEPTANCE_STATUSES = {"待业务验收", "已验收"}
          REQUIRED_PROFILES = {
              "fast-code": {
                  "andrej-karpathy-skill",
                  "agent-skills:source-driven-development",
                  "agent-skills:test-driven-development",
                  "0-vibe-dev-leader",
              },
              "standard-code": {
                  "andrej-karpathy-skill",
                  "agent-skills:source-driven-development",
                  "agent-skills:test-driven-development",
                  "0-vibe-dev-leader",
              },
              "high-risk": {
                  "andrej-karpathy-skill",
                  "agent-skills:source-driven-development",
                  "agent-skills:test-driven-development",
                  "agent-skills:security-and-hardening",
                  "agent-skills:ci-cd-and-automation",
                  "agent-skills:shipping-and-launch",
                  "0-vibe-dev-leader",
              },
              "nontrivial-code": {
                  "andrej-karpathy-skill",
                  "agent-skills:source-driven-development",
                  "agent-skills:test-driven-development",
                  "agent-skills:security-and-hardening",
                  "0-vibe-dev-leader",
              },
              "release": {
                  "andrej-karpathy-skill",
                  "agent-skills:source-driven-development",
                  "agent-skills:test-driven-development",
                  "agent-skills:security-and-hardening",
                  "agent-skills:shipping-and-launch",
                  "0-vibe-dev-leader",
              },
              "documentation": {
                  "andrej-karpathy-skill",
                  "agent-skills:source-driven-development",
              },
          }
          PROFILE_TIERS = {"fast-code": "S1", "standard-code": "S2", "high-risk": "S3"}
          LEGACY_PROFILE_TIERS = {"nontrivial-code": "S2", "release": "S3"}
          DOCUMENTATION_ROOTS = {
              "AGENTS.md",
              "COOPERATION_RULES.md",
              "DEV_SPEC.md",
              "GIT_WORKFLOW_AND_BRANCH_PROTECTION.md",
              "GOVERNANCE_EVIDENCE.md",
              "README.md",
              "RISK_TIERED_DELIVERY.md",
              "SKILL_ROUTING.md",
          }
          DOCUMENTATION_SUFFIXES = {".md", ".mdx", ".rst", ".txt"}
          HIGH_RISK_PATH_PARTS = {
              "acl", "auth", "authorization", "billing", "credential", "credentials", "database", "db",
              "deploy", "deployment", "finance", "infra", "kubernetes", "ledger", "migration", "migrations",
              "payment", "payments", "permission", "permissions", "rbac", "secret", "secrets", "security",
              "terraform",
          }
          HIGH_RISK_FILENAMES = {
              "dockerfile", "package-lock.json", "package.json", "pnpm-lock.yaml", "poetry.lock",
              "pyproject.toml", "requirements.txt", "yarn.lock",
          }
          HIGH_RISK_TOKENS = {
              "acl", "api", "apis", "auth", "authenticate", "authenticated", "authentication",
              "authenticator", "authorization", "authorize", "authorized", "billing", "contract", "contracts",
              "credential", "credentials", "identity", "jwt", "oauth", "openapi", "payment", "payments",
              "permission", "permissions", "rbac", "secret", "secrets", "security", "sso",
          }

          class EvidenceError(Exception):
              pass

          def fail(message):
              raise EvidenceError(message)

          def require_string(value, label):
              if not isinstance(value, str) or not value.strip():
                  fail(f"{label} must be a non-empty string")
              return value.strip()

          def canonical_identity(value, label):
              return require_string(value, label).casefold()

          def require_int(value, label):
              if not isinstance(value, int) or isinstance(value, bool) or value <= 0:
                  fail(f"{label} must be a positive integer")
              return value

          def require_mapping(value, label):
              if not isinstance(value, dict):
                  fail(f"{label} must be an object")
              return value

          def require_list(value, label):
              if not isinstance(value, list) or not value:
                  fail(f"{label} must be a non-empty list")
              return value

          def checked_task_id(value):
              task_id = require_string(value, "task_id")
              if not re.fullmatch(r"[a-z0-9][a-z0-9-]{1,79}", task_id):
                  fail("task_id must be a lower-case slug")
              return task_id

          def checked_relative_json_path(path, prefix, task_id):
              if path != f"{prefix}{task_id}.json":
                  fail(f"artifact path must be {prefix}{task_id}.json")
              return path

          def checked_commit_sha(value, label):
              commit_sha = require_string(value, label)
              if not re.fullmatch(r"[0-9a-f]{40}", commit_sha):
                  fail(f"{label} must be a lower-case 40-character commit SHA")
              return commit_sha

          def parse_json(raw, label):
              try:
                  value = json.loads(raw)
              except (TypeError, json.JSONDecodeError) as error:
                  fail(f"{label} is not valid JSON: {error}")
              return require_mapping(value, label)

          def verify_common(document, expected_repository, expected_pr, label):
              if document.get("schema_version") != SCHEMA_VERSION:
                  fail(f"{label}.schema_version must equal {SCHEMA_VERSION}")
              task_id = checked_task_id(document.get("task_id"))
              if document.get("repository") != expected_repository:
                  fail(f"{label}.repository does not match PR repository")
              if document.get("pull_request") != expected_pr:
                  fail(f"{label}.pull_request does not match PR number")
              return task_id

          def is_documentation_path(path):
              pure_path = PurePosixPath(path)
              if pure_path.is_absolute() or ".." in pure_path.parts:
                  return False
              if path in DOCUMENTATION_ROOTS:
                  return True
              if path.startswith((".governance/research/", ".governance/acceptance/")) and path.endswith(".json"):
                  return True
              return path.startswith("docs/") and pure_path.suffix in DOCUMENTATION_SUFFIXES

          def path_requires_high_risk_tier(path):
              pure_path = PurePosixPath(path.casefold())
              parts = set(pure_path.parts)
              normalized = re.sub(r"([A-Z]+)([A-Z][a-z])", r"\1 \2", path)
              normalized = re.sub(r"([a-z])([A-Z])", r"\1 \2", normalized)
              tokens = set(re.findall(r"[a-z]+", normalized.casefold()))
              return (
                  path.casefold().startswith(".github/workflows/")
                  or path.casefold() == ".governance/policy.json"
                  or pure_path.name in HIGH_RISK_FILENAMES
                  or bool(tokens & HIGH_RISK_TOKENS)
                  or bool(parts & HIGH_RISK_PATH_PARTS)
              )

          def verify_research(research, expected_repository, expected_pr, changed_paths):
              task_id = verify_common(research, expected_repository, expected_pr, "research")
              profile = require_string(research.get("route_profile"), "research.route_profile")
              required_skills = REQUIRED_PROFILES.get(profile)
              if required_skills is None:
                  fail("research.route_profile is not a locked profile")
              skills = require_list(research.get("skills_used"), "research.skills_used")
              checked_skills = [require_string(skill, "research.skills_used entry") for skill in skills]
              skill_set = set(checked_skills)
              if len(skill_set) != len(checked_skills):
                  fail("research.skills_used must not contain duplicate skills")
              if skill_set != required_skills:
                  fail(f"research.skills_used must exactly match {profile} routing")
              if profile == "documentation" and any(not is_documentation_path(path) for path in changed_paths):
                  fail("documentation routing may change only documentation or governance evidence paths")
              delivery_tier = research.get("delivery_tier")
              expected_tier = PROFILE_TIERS.get(profile)
              if expected_tier:
                  if delivery_tier != expected_tier:
                      fail(f"research.delivery_tier must be {expected_tier} for {profile}")
              elif delivery_tier is not None and delivery_tier != LEGACY_PROFILE_TIERS.get(profile, "S0"):
                  fail(f"research.delivery_tier is inconsistent with legacy {profile} routing")
              effective_tier = delivery_tier or LEGACY_PROFILE_TIERS.get(profile, "S0")
              if effective_tier != "S3" and any(path_requires_high_risk_tier(path) for path in changed_paths):
                  fail("high-risk paths require S3 routing")
              for index, source in enumerate(require_list(research.get("sources"), "research.sources")):
                  source = require_mapping(source, f"research.sources[{index}]")
                  for field in ("kind", "title", "url", "revision", "license", "maintenance", "security_assessment"):
                      require_string(source.get(field), f"research.sources[{index}].{field}")
                  if not re.match(r"https://", source["url"]):
                      fail(f"research.sources[{index}].url must use https")
              decision = require_mapping(research.get("reuse_decision"), "research.reuse_decision")
              if require_string(decision.get("decision"), "research.reuse_decision.decision") not in {"reuse", "build", "defer"}:
                  fail("research.reuse_decision.decision is invalid")
              require_string(decision.get("rationale"), "research.reuse_decision.rationale")
              for index, command in enumerate(require_list(research.get("verification_plan"), "research.verification_plan")):
                  require_string(command, f"research.verification_plan[{index}]")
              return task_id, delivery_tier

          def verify_acceptance(card, expected_repository, expected_pr, pr_author, delivery_tier):
              task_id = verify_common(card, expected_repository, expected_pr, "acceptance")
              implementer = require_string(card.get("implementer_identity"), "acceptance.implementer_identity")
              owner = require_mapping(card.get("owner"), "acceptance.owner")
              owner_identity = require_string(owner.get("identity"), "acceptance.owner.identity")
              require_string(owner.get("role"), "acceptance.owner.role")
              if canonical_identity(implementer, "acceptance.implementer_identity") != canonical_identity(pr_author, "event.pull_request.user.login"):
                  fail("acceptance implementer_identity must match the PR author")
              if canonical_identity(owner_identity, "acceptance.owner.identity") == canonical_identity(implementer, "acceptance.implementer_identity"):
                  fail("acceptance owner must differ from implementer")
              if card.get("status") not in VALID_ACCEPTANCE_STATUSES:
                  fail("acceptance.status must be 待业务验收 or 已验收")
              if card.get("delivery_tier") not in {None, delivery_tier}:
                  fail("acceptance.delivery_tier must match research.delivery_tier")
              if delivery_tier in {"S1", "S2", "S3"} and card.get("delivery_tier") != delivery_tier:
                  fail("acceptance.delivery_tier is required for new tiered evidence")
              require_string(card.get("original_requirement_scope"), "acceptance.original_requirement_scope")
              for index, scenario in enumerate(require_list(card.get("testable_scenarios"), "acceptance.testable_scenarios")):
                  scenario = require_mapping(scenario, f"acceptance.testable_scenarios[{index}]")
                  for field in ("id", "steps", "expected_result"):
                      require_string(scenario.get(field), f"acceptance.testable_scenarios[{index}].{field}")
              technical_review = require_mapping(card.get("technical_review"), "acceptance.technical_review")
              checked_commit_sha(technical_review.get("reviewed_commit"), "acceptance.technical_review.reviewed_commit")
              if technical_review.get("verdict") != "PASS":
                  fail("acceptance.technical_review.verdict must be PASS")
              reviewer = require_string(technical_review.get("reviewer_identity"), "acceptance.technical_review.reviewer_identity")
              if canonical_identity(reviewer, "acceptance.technical_review.reviewer_identity") in {
                  canonical_identity(implementer, "acceptance.implementer_identity"),
                  canonical_identity(owner_identity, "acceptance.owner.identity"),
              }:
                  fail("technical reviewer must differ from implementer and owner")
              for field in ("ci_deploy_evidence", "date", "known_gaps", "risk_rollback", "conclusion"):
                  require_string(card.get(field), f"acceptance.{field}")
              return task_id, implementer, reviewer

          def verify_policy(policy):
              if policy.get("schema_version") != SCHEMA_VERSION:
                  fail("policy.schema_version must equal 1")
              review = require_mapping(policy.get("automated_review"), "policy.automated_review")
              if review.get("mode") != "codex_fixed_sha":
                  fail("policy.automated_review.mode must be codex_fixed_sha")
              if review.get("require_independent_readonly_reviewer") is not True:
                  fail("policy.automated_review.require_independent_readonly_reviewer must be true")

          def verify_payload(payload):
              event = require_mapping(payload.get("event"), "event")
              pull_request = require_mapping(event.get("pull_request"), "event.pull_request")
              repository = require_mapping(event.get("repository"), "event.repository")
              repository_name = require_string(repository.get("full_name"), "event.repository.full_name")
              pr_number = require_int(event.get("number"), "event.number")
              pr_author = require_string(require_mapping(pull_request.get("user"), "event.pull_request.user").get("login"), "event.pull_request.user.login")
              changed_paths = [require_string(path, "changed_paths entry") for path in require_list(payload.get("changed_paths"), "changed_paths")]
              if len(changed_paths) >= 3000:
                  fail("PR file list is at or above GitHub's 3000-file ceiling")
              research_paths = [path for path in changed_paths if isinstance(path, str) and path.startswith(".governance/research/") and path.endswith(".json")]
              acceptance_paths = [path for path in changed_paths if isinstance(path, str) and path.startswith(".governance/acceptance/") and path.endswith(".json")]
              if not research_paths and not acceptance_paths:
                  if any(not isinstance(path, str) or not is_documentation_path(path) for path in changed_paths):
                      fail("S0 documentation-only PR may change only documentation paths")
                  policy = parse_json(require_mapping(payload.get("documents"), "documents").get(".governance/policy.json"), ".governance/policy.json")
                  verify_policy(policy)
                  return f"governance documentation-only passed for {repository_name}#{pr_number}"
              if len(research_paths) != 1 or len(acceptance_paths) != 1:
                  fail("PR must change exactly one research record and one acceptance card")
              documents = require_mapping(payload.get("documents"), "documents")
              research = parse_json(documents.get(research_paths[0]), research_paths[0])
              card = parse_json(documents.get(acceptance_paths[0]), acceptance_paths[0])
              research_task, delivery_tier = verify_research(research, repository_name, pr_number, changed_paths)
              card_task, _, _ = verify_acceptance(card, repository_name, pr_number, pr_author, delivery_tier)
              if research_task != card_task:
                  fail("research and acceptance task_id values differ")
              checked_relative_json_path(research_paths[0], ".governance/research/", research_task)
              checked_relative_json_path(acceptance_paths[0], ".governance/acceptance/", research_task)
              policy = parse_json(documents.get(".governance/policy.json"), ".governance/policy.json")
              verify_policy(policy)
              return f"governance evidence passed for {repository_name}#{pr_number} ({research_task})"

          def api_get_json(url, token):
              request = Request(url, headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              try:
                  with urlopen(request, timeout=20) as response:
                      return json.loads(response.read().decode("utf-8")), response.headers.get("Link", "")
              except (HTTPError, URLError, TimeoutError, json.JSONDecodeError) as error:
                  fail(f"GitHub API read failed: {error}")

          def decode_base64_content(content, path):
              if not isinstance(content, str):
                  fail(f"GitHub content response is invalid for {path}")
              try:
                  # GitHub's Contents API may wrap base64 output across lines;
                  # strip only ASCII transport whitespace before strict decoding.
                  normalized = re.sub(r"[\t\r\n ]", "", content)
                  return base64.b64decode(normalized, validate=True).decode("utf-8")
              except (binascii.Error, ValueError, UnicodeDecodeError) as error:
                  fail(f"GitHub content cannot be decoded for {path}: {error}")

          def api_get_text(repository, path, ref, token):
              url = f"{API_ROOT}/repos/{repository}/contents/{quote(path)}?ref={quote(ref)}"
              document, _ = api_get_json(url, token)
              if not isinstance(document, dict) or document.get("encoding") != "base64":
                  fail(f"GitHub content response is invalid for {path}")
              return decode_base64_content(document.get("content"), path)

          def next_link(link_header):
              for part in link_header.split(","):
                  if 'rel="next"' in part:
                      match = re.search(r"<([^>]+)>", part)
                      return match.group(1) if match else None
              return None

          def api_list(repository, endpoint, token):
              url = f"{API_ROOT}/repos/{repository}{endpoint}"
              values = []
              while url:
                  page, link = api_get_json(url, token)
                  if not isinstance(page, list):
                      fail(f"GitHub API list response is invalid for {endpoint}")
                  values.extend(page)
                  if len(values) >= 3000:
                      fail(f"GitHub API list reaches the 3000-item safety ceiling for {endpoint}")
                  url = next_link(link)
              return values

          def live_payload(event, token):
              if not token:
                  fail("GH_TOKEN is required")
              pull_request = event.get("pull_request") if isinstance(event, dict) else None
              repository = event.get("repository") if isinstance(event, dict) else None
              if not isinstance(pull_request, dict) or not isinstance(repository, dict):
                  fail("workflow must be invoked from a pull request event")
              repository_name = require_string(repository.get("full_name"), "event.repository.full_name")
              pr_number = require_int(event.get("number"), "event.number")
              head = require_mapping(pull_request.get("head"), "event.pull_request.head")
              base = require_mapping(pull_request.get("base"), "event.pull_request.base")
              head_sha = require_string(head.get("sha"), "event.pull_request.head.sha")
              base_sha = require_string(base.get("sha"), "event.pull_request.base.sha")
              changed_files = api_list(repository_name, f"/pulls/{pr_number}/files?per_page=100", token)
              payload = payload_from_changed_files(event, changed_files, {})
              changed_paths = payload["changed_paths"]
              research_paths = [path for path in changed_paths if path.startswith(".governance/research/") and path.endswith(".json")]
              acceptance_paths = [path for path in changed_paths if path.startswith(".governance/acceptance/") and path.endswith(".json")]
              documents = {
                  ".governance/policy.json": api_get_text(repository_name, ".governance/policy.json", base_sha, token),
              }
              if research_paths or acceptance_paths:
                  if len(research_paths) != 1 or len(acceptance_paths) != 1:
                      fail("PR must change exactly one research record and one acceptance card")
                  documents[research_paths[0]] = api_get_text(repository_name, research_paths[0], head_sha, token)
                  documents[acceptance_paths[0]] = api_get_text(repository_name, acceptance_paths[0], head_sha, token)
              payload["documents"] = documents
              return payload

          def payload_from_changed_files(event, changed_files, documents):
              changed_paths = []
              for item in changed_files:
                  item = require_mapping(item, "changed file")
                  changed_paths.append(require_string(item.get("filename"), "changed file filename"))
                  if item.get("status") == "renamed":
                      changed_paths.append(require_string(item.get("previous_filename"), "changed file previous_filename"))
              return {"event": event, "changed_paths": changed_paths, "documents": documents}

          def valid_fixture():
              task_id = "governance-proof"
              event = {
                  "repository": {"full_name": "owner/repository"},
                  "number": 17,
                  "pull_request": {
                      "head": {"sha": "a" * 40},
                      "user": {"login": "implementer"},
                  },
              }
              research = {
                  "schema_version": 1, "task_id": task_id, "repository": "owner/repository", "pull_request": 17,
                  "route_profile": "nontrivial-code",
                  "skills_used": sorted(REQUIRED_PROFILES["nontrivial-code"]),
                  "sources": [{"kind": "official_document", "title": "Docs", "url": "https://example.test/docs", "revision": "v1", "license": "N/A", "maintenance": "active", "security_assessment": "not-applicable"}],
                  "reuse_decision": {"decision": "reuse", "rationale": "Existing capability is sufficient."},
                  "verification_plan": ["python -m unittest"],
              }
              card = {
                  "schema_version": 1, "task_id": task_id, "repository": "owner/repository", "pull_request": 17,
                  "implementer_identity": "implementer", "owner": {"identity": "business-owner", "role": "Business owner"},
                  "status": "待业务验收", "original_requirement_scope": "A bounded change.",
                  "testable_scenarios": [{"id": "happy", "steps": "Run it", "expected_result": "It works"}],
                  "technical_review": {"reviewed_commit": "a" * 40, "verdict": "PASS", "reviewer_identity": "review-bot"},
                  "ci_deploy_evidence": "CI run 123", "date": "2026-08-13", "known_gaps": "none", "risk_rollback": "revert", "conclusion": "ready",
              }
              return {
                  "event": event,
                  "changed_paths": [f".governance/research/{task_id}.json", f".governance/acceptance/{task_id}.json", "src/example.py"],
                  "documents": {f".governance/research/{task_id}.json": json.dumps(research), f".governance/acceptance/{task_id}.json": json.dumps(card), ".governance/policy.json": json.dumps({"schema_version": 1, "automated_review": {"mode": "codex_fixed_sha", "require_independent_readonly_reviewer": True}})},
              }

          def self_test():
              if decode_base64_content("eyJvayI6IHRydWV9\n", "fixture") != '{"ok": true}':
                  raise SystemExit("self-test unexpectedly failed: wrapped base64 content")
              try:
                  decode_base64_content("eyJvayI6IHRydWV9!", "fixture")
              except EvidenceError:
                  pass
              else:
                  raise SystemExit("self-test unexpectedly passed: invalid base64 content")
              fixture = valid_fixture()
              verify_payload(fixture)
              documentation_only_fixture = json.loads(json.dumps(fixture))
              documentation_only_fixture["changed_paths"] = ["docs/governance-proof.md"]
              documentation_only_fixture["documents"] = {
                  ".governance/policy.json": fixture["documents"][".governance/policy.json"],
              }
              verify_payload(documentation_only_fixture)
              docs_rename_fixture = payload_from_changed_files(
                  fixture["event"],
                  [{"status": "renamed", "previous_filename": "docs/old.md", "filename": "docs/new.md"}],
                  documentation_only_fixture["documents"],
              )
              verify_payload(docs_rename_fixture)

              fast_fixture = json.loads(json.dumps(fixture))
              fast_research = json.loads(fast_fixture["documents"][".governance/research/governance-proof.json"])
              fast_research.update(route_profile="fast-code", skills_used=sorted(REQUIRED_PROFILES["fast-code"]), delivery_tier="S1")
              fast_fixture["documents"][".governance/research/governance-proof.json"] = json.dumps(fast_research)
              fast_card = json.loads(fast_fixture["documents"][".governance/acceptance/governance-proof.json"])
              fast_card["delivery_tier"] = "S1"
              fast_fixture["documents"][".governance/acceptance/governance-proof.json"] = json.dumps(fast_card)
              verify_payload(fast_fixture)
              for profile, tier in (("standard-code", "S2"), ("high-risk", "S3")):
                  tier_fixture = json.loads(json.dumps(fixture))
                  tier_research = json.loads(tier_fixture["documents"][".governance/research/governance-proof.json"])
                  tier_research.update(route_profile=profile, skills_used=sorted(REQUIRED_PROFILES[profile]), delivery_tier=tier)
                  tier_fixture["documents"][".governance/research/governance-proof.json"] = json.dumps(tier_research)
                  tier_card = json.loads(tier_fixture["documents"][".governance/acceptance/governance-proof.json"])
                  tier_card["delivery_tier"] = tier
                  tier_fixture["documents"][".governance/acceptance/governance-proof.json"] = json.dumps(tier_card)
                  verify_payload(tier_fixture)
              template_fixture = json.loads(json.dumps(fixture))
              template_research = json.loads(json.dumps({
                  "schema_version": 1,
                  "task_id": "governance-proof",
                  "repository": "owner/repository",
                  "pull_request": 17,
